---
name: Pre-commit action Node24 validation

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pre-commit:
    # runs on github hosted runner
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.10'
            - uses: tox-dev/action-pre-commit-uv@v1.1.2
              env:
                  # Keep pre-commit's normal hook environment installation.
                  DISABLE_PRE_COMMIT_UV_PATCH: '1'
                  # Formatting runs in the separate clang-format-check job
                  # so its failures remain advisory.
                  SKIP: gem5-git-clang-format

    # Runs on the github hosted runner
    # Checks changed lines against the PR merge base with the same pinned
    # clang-format version used by the local pre-commit hook.
    clang-format-check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0  # Need full history to get the merge base

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.10'

            - name: Get merge base commit
              id: get-base-commit
              run: |
                  # Calculate the merge base between the target branch and the PR branch
                  BASE_SHA="c97d264687b068e50c17b776846630737478585d"
                  HEAD_SHA="${{ github.sha }}"
                  MERGE_BASE=$(git merge-base $BASE_SHA $HEAD_SHA)

                  echo "base_commit=$MERGE_BASE" >> $GITHUB_OUTPUT

            - name: Run clang-format check
              uses: tox-dev/action-pre-commit-uv@v1.1.2
              with:
                  extra_args: >-
                      gem5-git-clang-format
                      --from-ref ${{ steps.get-base-commit.outputs.base_commit }}
                      --to-ref HEAD
              env:
                  DISABLE_PRE_COMMIT_UV_PATCH: '1'
                  GEM5_CI_PR_BASE_COMMIT: ${{ steps.get-base-commit.outputs.base_commit }}
